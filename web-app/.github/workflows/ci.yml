name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18, 20]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: web-app/package-lock.json
        
    - name: Install dependencies
      run: |
        cd web-app
        npm ci
        
    - name: Run linting
      run: |
        cd web-app
        npm run lint
        
    - name: Run type checking
      run: |
        cd web-app
        npm run type-check
        
    - name: Run unit tests
      run: |
        cd web-app
        npm run test:run
        
    - name: Run unit tests with coverage
      run: |
        cd web-app
        npm run test:coverage
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        directory: web-app/coverage
        fail_ci_if_error: true
        
    - name: Build application
      run: |
        cd web-app
        npm run build
        
    - name: Install Playwright browsers
      run: |
        cd web-app
        npx playwright install --with-deps
        
    - name: Run E2E tests
      run: |
        cd web-app
        npm run test:e2e
        
    - name: Upload E2E test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report-${{ matrix.node-version }}
        path: web-app/playwright-report/
        retention-days: 30
        
    - name: Run accessibility tests
      run: |
        cd web-app
        npm run test:run -- --reporter=verbose src/test/accessibility.ts
        
    - name: Run performance tests
      run: |
        cd web-app
        npm run test:run -- --reporter=verbose src/test/performance.test.ts
        
    - name: Bundle size analysis
      run: |
        cd web-app
        npm run build:analyze
        
    - name: Upload bundle analysis
      uses: actions/upload-artifact@v4
      with:
        name: bundle-analysis-${{ matrix.node-version }}
        path: web-app/.next/analyze/
        retention-days: 30

  security:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web-app/package-lock.json
        
    - name: Install dependencies
      run: |
        cd web-app
        npm ci
        
    - name: Run security audit
      run: |
        cd web-app
        npm run security:audit
        
    - name: Run CodeQL analysis
      uses: github/codeql-action/analyze@v3
      with:
        languages: javascript
        
  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web-app/package-lock.json
        
    - name: Install dependencies
      run: |
        cd web-app
        npm ci
        
    - name: Build application
      run: |
        cd web-app
        npm run build
        
    - name: Run Lighthouse CI
      run: |
        cd web-app
        npm install -g @lhci/cli
        lhci autorun
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        
    - name: Upload Lighthouse results
      uses: actions/upload-artifact@v4
      with:
        name: lighthouse-results
        path: web-app/lighthouse-report.html
        retention-days: 30

  deploy:
    runs-on: ubuntu-latest
    needs: [test, security, lighthouse]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: web-app/package-lock.json
        
    - name: Install dependencies
      run: |
        cd web-app
        npm ci
        
    - name: Build application
      run: |
        cd web-app
        npm run build
        
    - name: Deploy to Vercel
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.ORG_ID }}
        vercel-project-id: ${{ secrets.PROJECT_ID }}
        working-directory: web-app
        
  notify:
    runs-on: ubuntu-latest
    needs: [test, security, lighthouse, deploy]
    if: always()
    
    steps:
    - name: Notify on success
      if: ${{ success() }}
      run: |
        echo "✅ All tests passed and deployment successful!"
        
    - name: Notify on failure
      if: ${{ failure() }}
      run: |
        echo "❌ Tests failed or deployment unsuccessful!"
        
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: checks } = await github.rest.checks.listForRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.sha,
          });
          
          const testResults = checks.check_runs.filter(check => 
            check.name.includes('test') || check.name.includes('lint')
          );
          
          const passedTests = testResults.filter(test => test.conclusion === 'success').length;
          const totalTests = testResults.length;
          
          const comment = `
          ## 🧪 Test Results
          
          **${passedTests}/${totalTests} tests passed**
          
          ${testResults.map(test => 
            `- ${test.conclusion === 'success' ? '✅' : '❌'} ${test.name}`
          ).join('\n')}
          
          ${passedTests === totalTests ? '🎉 All tests passed!' : '⚠️ Some tests failed'}
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });